name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure hardwareAccelerated in AndroidManifest
        run: |
          if ! grep -q 'hardwareAccelerated' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:hardwareAccelerated="true"/' \
              android/app/src/main/AndroidManifest.xml
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Viewer-SKP-OBJ-3DS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
