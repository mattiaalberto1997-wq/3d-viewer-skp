<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>3D Viewer SKP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      z-index: 10;
      min-height: 48px;
      flex-shrink: 0;
    }
    #topbar .info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
      margin-right: 8px;
    }
    #filename {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e94560;
    }
    #tricount {
      font-size: 11px;
      color: #8899aa;
    }
    #open-btn {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #open-btn:active { background: #c73650; }
    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #1a1a2e;
    }
    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #bottombar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 8px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      z-index: 10;
      min-height: 48px;
      flex-shrink: 0;
    }
    .ctrl-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      color: #8899aa;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      gap: 2px;
      min-width: 56px;
    }
    .ctrl-btn.active {
      color: #e94560;
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.1);
    }
    .ctrl-btn svg { width: 20px; height: 20px; }
    .ctrl-btn:active { transform: scale(0.95); }
    #drop-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #drop-overlay.visible {
      display: flex;
    }
    #drop-overlay .ring {
      width: 120px; height: 120px;
      border: 3px dashed #e94560;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s ease-in-out infinite;
    }
    #drop-overlay .ring svg { width: 48px; height: 48px; color: #e94560; }
    #drop-overlay p { margin-top: 16px; font-size: 16px; color: #e94560; font-weight: 600; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.7; }
    }
    #loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.85);
      z-index: 90;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #loading-overlay.visible { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #0f3460;
      border-top: 4px solid #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay p { margin-top: 12px; font-size: 14px; color: #8899aa; }
    #welcome {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #556677;
      text-align: center;
      padding: 24px;
    }
    #welcome svg { width: 72px; height: 72px; margin-bottom: 16px; opacity: 0.5; }
    #welcome h2 { font-size: 18px; margin-bottom: 8px; color: #8899aa; }
    #welcome p { font-size: 13px; line-height: 1.5; }
    #error-toast {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 200;
      max-width: 90%;
      text-align: center;
      animation: fadeInUp 0.3s;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <div id="topbar">
      <div class="info">
        <span id="filename">3D Viewer SKP</span>
        <span id="tricount"></span>
      </div>
      <button id="open-btn" onclick="document.getElementById('file-input').click()">📂 Apri File</button>
      <input type="file" id="file-input" style="display:none">
    </div>

    <!-- Canvas -->
    <div id="canvas-container">
      <div id="welcome">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/>
        </svg>
        <h2>Benvenuto in 3D Viewer</h2>
        <p>Apri un file <strong>.skp</strong>, <strong>.obj</strong> o <strong>.3ds</strong><br>
        per visualizzarlo in 3D.<br><br>
        Tocca <strong>"Apri File"</strong> o trascina qui.</p>
      </div>
      <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Caricamento modello…</p>
      </div>
      <div id="drop-overlay">
        <div class="ring">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4v16m0-16l-4 4m4-4l4 4"/>
          </svg>
        </div>
        <p>Rilascia per aprire</p>
      </div>
      <div id="error-toast"></div>
    </div>

    <!-- Bottom Bar -->
    <div id="bottombar">
      <button class="ctrl-btn" id="btn-center" onclick="centerModel()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h4V6m0 4L3 6m14 4h4V6m0 4l-4-4M7 14H3v4m4-4l-4 4m14-4h4v4m-4-4l4 4"/>
        </svg>
        Centra
      </button>
      <button class="ctrl-btn" id="btn-wireframe" onclick="toggleWireframe()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
        </svg>
        Wireframe
      </button>
      <button class="ctrl-btn" id="btn-clay" onclick="toggleClay()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle cx="12" cy="12" r="9" stroke-width="2"/>
        </svg>
        Argilla
      </button>
      <button class="ctrl-btn" id="btn-grid" onclick="toggleGrid()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3h18v18H3V3zm0 6h18M3 15h18M9 3v18M15 3v18"/>
        </svg>
        Griglia
      </button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { TDSLoader } from 'three/addons/loaders/TDSLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ─── State ───
    let scene, camera, renderer, controls, gridHelper;
    let currentModel = null;
    let originalMaterials = new Map();
    let isWireframe = false;
    let isClay = false;
    let isGridVisible = true;

    // ─── Init Three.js ───
    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.01, 10000);
      camera.position.set(5, 4, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = false;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      // Controls (touch optimized)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.touches = {
        ONE: THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_PAN
      };
      controls.minDistance = 0.1;
      controls.maxDistance = 500;
      controls.target.set(0, 0, 0);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight1.position.set(5, 10, 7);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x8899cc, 0.4);
      dirLight2.position.set(-5, 5, -5);
      scene.add(dirLight2);

      const hemiLight = new THREE.HemisphereLight(0x606080, 0x404040, 0.4);
      scene.add(hemiLight);

      // Grid
      gridHelper = new THREE.GridHelper(20, 20, 0x0f3460, 0x0a1a30);
      scene.add(gridHelper);

      updateGridBtnState();

      // Resize
      const onResize = () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      };
      window.addEventListener('resize', onResize);
      screen.orientation?.addEventListener?.('change', () => setTimeout(onResize, 100));

      // Animate
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    // ─── File loading ───
    async function loadFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (!['skp', 'obj', '3ds'].includes(ext)) {
        showError(`Formato non supportato: .${ext}\nFormati validi: .skp, .obj, .3ds`);
        return;
      }

      showLoading(true);
      hideWelcome();

      try {
        const buffer = await file.arrayBuffer();
        let object;

        switch (ext) {
          case 'skp':
            object = await loadSKP(buffer);
            break;
          case 'obj':
            object = loadOBJ(buffer);
            break;
          case '3ds':
            object = load3DS(buffer);
            break;
        }

        if (object) {
          setModel(object, file.name);
        }
      } catch (err) {
        console.error('Errore caricamento:', err);
        showError(`Errore nel caricamento: ${err.message || err}`);
      } finally {
        showLoading(false);
      }
    }

    // ─── SKP Loader ───
    async function loadSKP(buffer) {
      try {
        const { SkpFile, toGLB } = await import('https://esm.sh/openskp@1.5.0');
        const bytes = new Uint8Array(buffer);

        let skp;
        try {
          skp = SkpFile.fromBytes(bytes);
        } catch (e1) {
          console.warn('fromBytes fallito, provo open():', e1);
          try {
            skp = SkpFile.open(bytes);
          } catch (e2) {
            throw new Error(`Impossibile aprire il file SKP: ${e1.message}`);
          }
        }

        const skpScene = skp.buildScene();
        const glbData = toGLB(skpScene);

        return new Promise((resolve, reject) => {
          const loader = new GLTFLoader();
          loader.parse(glbData.buffer || glbData, '', (gltf) => {
            const model = gltf.scene;
            model.rotation.x = -Math.PI / 2; // Z-up → Y-up
            resolve(model);
          }, (err) => {
            reject(new Error('Errore parsing GLB: ' + err.message));
          });
        });
      } catch (err) {
        if (err.message && err.message.includes('Impossibile')) throw err;
        throw new Error('Errore nel caricamento SKP: ' + (err.message || err));
      }
    }

    // ─── OBJ Loader ───
    function loadOBJ(buffer) {
      const text = new TextDecoder('utf-8').decode(buffer);
      const loader = new OBJLoader();
      const object = loader.parse(text);

      const defaultMat = new THREE.MeshStandardMaterial({
        color: 0xbbbbbb,
        side: THREE.DoubleSide,
        roughness: 0.6,
        metalness: 0.1
      });

      object.traverse((child) => {
        if (child.isMesh && !child.material) {
          child.material = defaultMat;
        } else if (child.isMesh && child.material) {
          if (Array.isArray(child.material)) {
            child.material = child.material.map(m =>
              (!m || m.type === 'MeshBasicMaterial') ? defaultMat : m
            );
          } else if (child.material.type === 'MeshBasicMaterial') {
            child.material = defaultMat;
          }
        }
      });

      return object;
    }

    // ─── 3DS Loader ───
    function load3DS(buffer) {
      const loader = new TDSLoader();
      const object = loader.parse(buffer);
      object.rotation.x = -Math.PI / 2; // Z-up → Y-up
      return object;
    }

    // ─── Set Model ───
    function setModel(object, filename) {
      // Remove old model
      if (currentModel) {
        scene.remove(currentModel);
        originalMaterials.clear();
      }

      // Reset states
      isWireframe = false;
      isClay = false;
      document.getElementById('btn-wireframe').classList.remove('active');
      document.getElementById('btn-clay').classList.remove('active');

      currentModel = object;

      // Store original materials
      currentModel.traverse((child) => {
        if (child.isMesh) {
          originalMaterials.set(child, child.material);
        }
      });

      scene.add(currentModel);

      // Fit to view
      fitToView(currentModel);

      // Update UI
      document.getElementById('filename').textContent = filename;

      let triCount = 0;
      currentModel.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const geo = child.geometry;
          if (geo.index) {
            triCount += geo.index.count / 3;
          } else if (geo.attributes.position) {
            triCount += geo.attributes.position.count / 3;
          }
        }
      });
      document.getElementById('tricount').textContent =
        `${Math.round(triCount).toLocaleString('it-IT')} triangoli`;
    }

    // ─── Fit to View ───
    function fitToView(object) {
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      // Center on origin
      object.position.sub(center);

      // Recompute box after centering
      const box2 = new THREE.Box3().setFromObject(object);
      const minY = box2.min.y;
      object.position.y -= minY; // Sit on Y=0

      // Scale to fit
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const targetSize = 6;
        const scale = targetSize / maxDim;
        object.scale.multiplyScalar(scale);
      }

      // Position camera
      const finalBox = new THREE.Box3().setFromObject(object);
      const finalSize = finalBox.getSize(new THREE.Vector3());
      const finalCenter = finalBox.getCenter(new THREE.Vector3());

      const maxFinal = Math.max(finalSize.x, finalSize.y, finalSize.z);
      const dist = maxFinal * 1.8;

      camera.position.set(
        finalCenter.x + dist * 0.7,
        finalCenter.y + dist * 0.5,
        finalCenter.z + dist * 0.7
      );
      controls.target.copy(finalCenter);
      controls.update();
    }

    // ─── Controls ───
    window.centerModel = function() {
      if (currentModel) {
        fitToView(currentModel);
      }
    };

    window.toggleWireframe = function() {
      if (!currentModel) return;
      isWireframe = !isWireframe;

      currentModel.traverse((child) => {
        if (child.isMesh) {
          if (Array.isArray(child.material)) {
            child.material.forEach(m => { m.wireframe = isWireframe; });
          } else {
            child.material.wireframe = isWireframe;
          }
        }
      });

      document.getElementById('btn-wireframe').classList.toggle('active', isWireframe);
    };

    window.toggleClay = function() {
      if (!currentModel) return;
      isClay = !isClay;

      const clayMat = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        roughness: 0.55,
        metalness: 0.0,
        side: THREE.DoubleSide,
        wireframe: isWireframe
      });

      currentModel.traverse((child) => {
        if (child.isMesh) {
          if (isClay) {
            child.material = clayMat;
          } else {
            const orig = originalMaterials.get(child);
            if (orig) {
              child.material = orig;
              if (Array.isArray(orig)) {
                orig.forEach(m => { m.wireframe = isWireframe; });
              } else {
                orig.wireframe = isWireframe;
              }
            }
          }
        }
      });

      document.getElementById('btn-clay').classList.toggle('active', isClay);
    };

    window.toggleGrid = function() {
      if (!gridHelper) return;
      isGridVisible = !isGridVisible;
      gridHelper.visible = isGridVisible;
      updateGridBtnState();
    };

    function updateGridBtnState() {
      document.getElementById('btn-grid').classList.toggle('active', isGridVisible);
    }

    // ─── UI Helpers ───
    function hideWelcome() {
      const w = document.getElementById('welcome');
      if (w) w.style.display = 'none';
    }

    function showLoading(show) {
      document.getElementById('loading-overlay').classList.toggle('visible', show);
    }

    function showError(msg) {
      const toast = document.getElementById('error-toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    // ─── File Input ───
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadFile(file);
      e.target.value = '';
    });

    // ─── Drag & Drop ───
    const container = document.getElementById('canvas-container');
    const dropOverlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    container.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add('visible');
    });

    container.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('visible');
      }
    });

    container.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    container.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('visible');
      const file = e.dataTransfer.files[0];
      if (file) loadFile(file);
    });

    // ─── Boot ───
    init();
    console.log('3D Viewer SKP inizializzato correttamente');
  </script>
</body>
</html>
